<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:JBM;src:url(JBM700.woff2) format('woff2')}
html,body{margin:0;background:#060707;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style></head><body>
<canvas id="wall"></canvas>
<script src="./lib/asciipaper.mjs"></script>
<script src="./lib/fluid-field.plain.js"></script>
<script>
window.addEventListener('error', e => { window.__err = e.message; });
(async () => {
  const ff = new FontFace('JBM', 'url(JBM700.woff2) format("woff2")');
  try { document.fonts.add(await ff.load()); } catch (e) {}
  const CHARS = ' .:+-=xICA$FY#@';
  const glsl = `uniform sampler2D flow;uniform float moving;
vec4 cell(vec2 uv){
  vec3 f=moving>0.5?(texture2D(flow,uv).rgb-vec3(0.5,0.5,0.0))*vec3(0.36,0.36,0.8):vec3(0.0);
  float time=u_time;
  float px=(uv.x-0.5-f.x)*u_aspect, py=uv.y-0.5-f.y;
  float qx=px+0.22*sin(py*5.2+time*0.17)+0.15*sin(px*2.4-py*3.1-time*0.1);
  float qy=py+0.19*sin(px*3.5+time*0.13);
  float radius=length(vec2(qx*0.8+0.18,qy*1.1));
  float folds=0.5+0.5*sin(radius*14.0-qx*2.8+sin(qy*5.0)*1.4-time*0.24);
  float cloud=0.5+0.5*sin(qx*3.6-qy*2.9+time*0.09);
  float light=clamp(folds*folds*(0.48+cloud*0.32)-0.075+f.z*0.75,0.0,1.0);
  float value=floor(light*255.0+0.5);
  float r=value<10.0?0.0:min(255.0,value*1.45), g=r*185.0/232.0;
  return vec4(r/255.0,g/255.0,0.0,floor(0.299*r+0.587*g)/255.0);
}`;
  let flow, flowBytes, t = 0;
  const upload = s => s.texture('flow', flow.columns, flow.rows, texture(flow, flowBytes));
  asciipaper.ascii({
    canvas: document.getElementById('wall'), charset: CHARS, glsl, cell: Number(new URLSearchParams(location.search).get('cell') || 8), aspect: .6,
    maxCells: 26000, background: '#060707', font: '"JBM", monospace', time: 4, period: 200 * Math.PI,
    resize(scene) { flow = new FluidField(scene.width / scene.height, 2.2, true); flowBytes = new Uint8Array(flow.columns * flow.rows * 4); upload(scene); },
    update(scene, dt) {
      t += dt;
      // stir it along a slow path so it moves with nobody at the mouse
      flow.move(0.5 + 0.33 * Math.sin(t * 0.62), 0.5 + 0.27 * Math.sin(t * 0.44 + 1.1), 1);
      flow.step(Math.min(.05, dt));
      const moving = flow.active;
      if (moving) upload(scene);
      scene.uniforms.moving = moving ? 1 : 0;
    }
  });
  window.__ready = true;
})();
</script>
</body></html>
